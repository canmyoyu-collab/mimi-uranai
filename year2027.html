<!DOCTYPE html>
<html lang="ja">
<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #d4728a;
    --primary-light: #e8909a;
    --primary-deep: #c05878;
    --second: #8a6fb8;
    --second-light: #a98fd4;
    --second-deep: #715399;
    --text: #5a2d42;
    --text-sub: #a06070;
    --text-body: #4a2535;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #f9e4ee 0%, #f2c8dc 40%, #fde8f2 70%, #fdf0f8 100%);
    font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    color: var(--text);
    overflow-x: hidden;
  }

  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; border-radius: 50%; background: #e8a0c0;
    animation: twinkle var(--dur) ease-in-out infinite var(--delay);
  }

  @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:.9} }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes shimmer { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(138,111,184,.4)} 70%{box-shadow:0 0 0 16px rgba(138,111,184,0)} }
  @keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 16px 48px;
    position: relative;
    z-index: 1;
  }

  /* ──── HEADER ──── */
  .header { text-align: center; margin-bottom: 28px; }
  .header-icon {
    font-size: 50px;
    display: inline-block;
    animation: float 4s ease-in-out infinite;
    margin-bottom: 8px;
  }
  .title {
    font-size: 24px;
    font-weight: 400;
    letter-spacing: .16em;
    background: linear-gradient(90deg, var(--primary-deep), var(--primary-light), var(--second), var(--primary-deep));
    background-size: 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 6s linear infinite;
    margin-bottom: 4px;
  }
  .subtitle { font-size: 12px; letter-spacing: .3em; color: #b07085; }
  .divider {
    margin: 12px auto;
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, #e8a0b5, transparent);

    border: 1px solid rgba(220,150,175,.3);
    border-radius: 24px;

    margin-bottom: 20px;
    animation: fadeUp .5s ease both;
    box-shadow: 0 4px 24px rgba(200,100,130,.1);

  .card-title {
    font-size: 15px;
    letter-spacing: .1em;
    color: var(--primary-deep);
    margin-bottom: 16px;
    text-align: center;
    font-weight: 600;
  }
  .card-lead {
    font-size: 13px;
    line-height: 1.9;
    color: var(--text-body);
  }

    border-color: rgba(138,111,184,.3);

  .global-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px; border-radius: 50%;
    font-size: 32px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--second-light), var(--second));
    margin-bottom: 12px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .global .card-lead { text-align: left; }

  .field { flex: 1; position: relative; }
  .field select {
    width: 100%;
    padding: 16px 38px 16px 16px;
    background: rgba(255,240,245,.8);
    border: 1.5px solid rgba(212,114,138,.4);
    border-radius: 16px;
    color: var(--text);
    font-size: 20px;
    font-family: inherit;
    text-align: center;
    text-align-last: center;
    outline: none;
    -webkit-appearance: none;

  .field span {

  .hint { font-size: 12px; color: var(--text-sub); text-align: center; line-height: 1.7; }

  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    font-family: inherit;
    letter-spacing: .15em;

    text-align: center;
    text-decoration: none;

    color: var(--text-sub);
    margin-top: 10px;

    display: block; text-align: center; margin-top: 18px;

// ─── STARS ───────────────────────────────────────────
const starsEl = document.getElementById('stars');
for (let i = 0; i < 45; i++) {
  const s = document.createElement('div');

  const size = i % 6 === 0 ? 3 : 2;

    left:${Math.random()*100}%;
    top:${Math.random()*100}%;
    width:${size}px; height:${size}px;
    --dur:${2+Math.random()*3}s;
    --delay:-${Math.random()*3}s;

}

// ─── NUMEROLOGY ──────────────────────────────────────
const YEAR = 2027;

// 1〜9 になるまで各桁を足す
function reduce(n) {
  while (n > 9) n = String(n).split('').reduce((a, d) => a + Number(d), 0);
  return n;
}

const GLOBAL_NUMBER = reduce(YEAR); // 2+0+2+7 = 11 → 2

// パーソナルイヤーナンバー = 誕生月 + 誕生日 + グローバルイヤーナンバー

  return reduce(month + day + GLOBAL_NUMBER);

function daysInMonth(m) {
  return [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] || 31;
}

function options(max, selected) {
  let html = '<option value="">--</option>';
  for (let i = 1; i <= max; i++) {
    html += `<option value="${i}" ${String(i) === String(selected) ? 'selected' : ''}>${i}</option>`;
  }
  return html;
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// クリップボードAPIが使えない環境(アプリ内ブラウザ等)でもコピーできるようにする
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    document.body.removeChild(ta);
    return ok;
  }
}

}

// ─── EVENTS ──────────────────────────────────────────
function bindEvents() {
  const monthSel = document.getElementById('monthSel');
  const daySel = document.getElementById('daySel');
  const btnCalc = document.getElementById('btnCalc');

  function updateBtn() {
    if (btnCalc) btnCalc.disabled = !(state.month && state.day);
  }

  if (monthSel) {
    monthSel.addEventListener('change', e => {
      state.month = e.target.value;
      const max = state.month ? daysInMonth(Number(state.month)) : 31;
      if (Number(state.day) > max) state.day = '';
      daySel.innerHTML = options(max, state.day);
      updateBtn();
    });
  }
  if (daySel) {
    daySel.addEventListener('change', e => {
      state.day = e.target.value;
      updateBtn();
    });
  }
  if (btnCalc) btnCalc.addEventListener('click', renderLoading);

  const btnRetry = document.getElementById('btnRetry');
  if (btnRetry) btnRetry.addEventListener('click', renderInput);

  const btnShare = document.getElementById('btnShare');
  if (btnShare) {
    btnShare.addEventListener('click', () => {
      const panel = document.getElementById('sharePanel');
      panel.classList.toggle('open');
      if (panel.classList.contains('open')) panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  const btnCopy = document.getElementById('btnCopy');
  if (btnCopy) {
    btnCopy.addEventListener('click', async () => {
      const ok = await copyText(shareText(personalYear(Number(state.month), Number(state.day))));
      document.getElementById('shareMsg').textContent = ok
        ? 'コピーしました！SNSやLINEに貼りつけてくださいね'
        : '上の文章を長押しして、コピーしてくださいね';
    });
  }
}
